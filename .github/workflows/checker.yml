name: Movie Checker

permissions:
  contents: write



on:

  schedule:

    - cron: "*/30 * * * *"


  workflow_dispatch:



jobs:


  check_movies:


    runs-on: ubuntu-latest



    steps:


    - name: Download code

      uses: actions/checkout@v4



    - name: Install Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: Install packages

      run: |

        pip install -r requirements.txt

        playwright install --with-deps chromium



    - name: Run checker

      env:

        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

        CHAT_ID: ${{ secrets.CHAT_ID }}

      run: |

        python movie_checker.py



    - name: Save bot data

      run: |

        git config --global user.name "Movie-Man-Bot"

        git config --global user.email "movie-man-bot@github.com"


        git add watchlist.json telegram_offset.txt


        git commit -m "Update bot data" || exit 0


        git push
